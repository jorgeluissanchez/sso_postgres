# =====================================================================
# Grafana Tempo — traces backend, monolithic single-binary mode with
# local filesystem storage. Minimal config accepted by the current
# grafana/tempo image (its strict parser rejects the ingester/
# compactor/metrics_generator tuning blocks, so we rely on defaults).
#
# Follow-up: the span-metrics / service-graph generator (which
# remote_writes RED metrics to Mimir) can be re-added once pinned to a
# Tempo version whose overrides schema is confirmed. Traces work fully
# without it.
# =====================================================================
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
