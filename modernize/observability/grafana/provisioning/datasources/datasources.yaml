# =====================================================================
# Grafana datasource provisioning — wires the three LGTM backends
# automatically on startup so there is zero manual clicking. Also sets
# up cross-links: metrics<->traces (exemplars), logs<->traces (derived
# fields), and traces<->logs/metrics (Tempo correlations).
# =====================================================================
apiVersion: 1

datasources:
  # ---- Metrics (Mimir, Prometheus-compatible) ----------------------
  - name: Mimir
    type: prometheus
    uid: mimir
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true
    jsonData:
      httpMethod: POST
      # Jump from a metric exemplar straight to the trace in Tempo.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  # ---- Logs (Loki) -------------------------------------------------
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # OTLP logs carry the trace id as structured metadata; let a log
      # line link straight to its trace in Tempo.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: '${__value.raw}'
          datasourceUid: tempo

  # ---- Traces (Tempo) ----------------------------------------------
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # From a span, pivot to its logs (Loki) and its RED metrics (Mimir).
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
      tracesToMetrics:
        datasourceUid: mimir
      # Service graph is built from Tempo's metrics_generator output in Mimir.
      serviceMap:
        datasourceUid: mimir
      nodeGraph:
        enabled: true
